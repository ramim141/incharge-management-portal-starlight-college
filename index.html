<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="XI Portal" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Class Portal | ক্লাস ইনচার্জ ও শিক্ষার্থী পোর্টাল</title>

    <!-- Plus Jakarta Sans for Latin + digits, Hind Siliguri for Bangla glyphs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef1ff',
                100: '#e0e5ff',
                200: '#c6cefe',
                300: '#a3aefc',
                400: '#7e85f8',
                500: '#6261f1',
                600: '#5045e5',
                700: '#4437ca',
                800: '#382fa3',
                900: '#312d81',
                950: '#1d1a4b',
              },
              canvas: '#f5f6fb',
              ink: '#0f1222',
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"Hind Siliguri"', 'system-ui', 'sans-serif'],
              bangla: ['"Hind Siliguri"', 'sans-serif'],
            },
            boxShadow: {
              card: '0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06)',
              lift: '0 10px 30px -12px rgba(68,55,202,.45)',
              nav: '0 -8px 30px -12px rgba(16,24,40,.18)',
            },
            keyframes: {
              sheetUp: { from: { transform: 'translateY(100%)' }, to: { transform: 'translateY(0)' } },
              fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
              rise: { from: { opacity: 0, transform: 'translateY(8px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
              toastIn: { from: { opacity: 0, transform: 'translateY(-12px) scale(.96)' }, to: { opacity: 1, transform: 'translateY(0) scale(1)' } },
              shake: { '10%,90%': { transform: 'translateX(-2px)' }, '20%,80%': { transform: 'translateX(4px)' }, '30%,50%,70%': { transform: 'translateX(-6px)' }, '40%,60%': { transform: 'translateX(6px)' } },
              pop: { '0%': { transform: 'scale(.6)', opacity: 0 }, '60%': { transform: 'scale(1.08)', opacity: 1 }, '100%': { transform: 'scale(1)' } },
            },
            animation: {
              sheet: 'sheetUp .32s cubic-bezier(.16,1,.3,1)',
              fade: 'fadeIn .2s ease-out',
              // 'backwards' (not 'both') so no transform lingers — a leftover transform would trap position:fixed children
              rise: 'rise .35s cubic-bezier(.16,1,.3,1) backwards',
              toast: 'toastIn .28s cubic-bezier(.16,1,.3,1)',
              shake: 'shake .45s ease-in-out',
              pop: 'pop .45s cubic-bezier(.16,1,.3,1) both',
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
