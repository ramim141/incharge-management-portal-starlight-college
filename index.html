<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Class Portal" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Class Portal | ক্লাস ইনচার্জ ও শিক্ষার্থী পোর্টাল</title>

    <!-- Plus Jakarta Sans for Latin + digits, Noto Sans Bengali for Bangla glyphs.
         Loaded without blocking the first paint; text shows in a system font until they arrive. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"></noscript>

    <!-- Shown the instant the page arrives, before any script runs; React replaces it -->
    <style>
      .boot { min-height: 100dvh; display: grid; place-items: center; background: #f5f6fb; }
      .boot img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 30px -12px rgba(68, 55, 202, .45); animation: bootPulse 1.4s ease-in-out infinite; }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .75; } }
    </style>
  </head>
  <body class="bg-canvas text-ink antialiased font-sans">
    <div id="root"><div class="boot"><img src="/icons/icon-192.png" alt="" width="72" height="72" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
